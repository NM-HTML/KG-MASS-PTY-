<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KG MASS (PTY) | Premium Plumbing</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Poppins;
}

body{
  background:#05070d;
  color:white;
  overflow-x:hidden;
}

/* NAV */
nav{
  position:fixed;
  width:100%;
  top:0;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:20px 40px;
  z-index:10;
  background:rgba(0,0,0,0.3);
  backdrop-filter:blur(10px);
}

nav h1 span{color:#00d4ff;}

nav a{
  background:#00d4ff;
  color:black;
  padding:10px 15px;
  border-radius:8px;
  text-decoration:none;
  font-weight:700;
}

/* HERO VIDEO */
.hero{
  height:100vh;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  overflow:hidden;
}

.hero video{
  position:absolute;
  width:100%;
  height:100%;
  object-fit:cover;
}

.overlay{
  position:absolute;
  width:100%;
  height:100%;
  background:radial-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.95));
}

.hero-content{
  position:relative;
  z-index:2;
}

.hero h2{
  font-size:55px;
  opacity:0;
  transform:translateY(30px);
  animation:fadeUp 1s forwards;
}

.hero p{
  margin-top:10px;
  opacity:0.7;
}

.btn{
  display:inline-block;
  margin-top:20px;
  background:#00d4ff;
  color:black;
  padding:12px 20px;
  border-radius:10px;
  text-decoration:none;
  font-weight:700;
}

/* GLASS SECTIONS */
.section{
  padding:100px 20px;
  text-align:center;
}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:20px;
  max-width:1000px;
  margin:auto;
}

.card{
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.1);
  padding:30px;
  border-radius:15px;
  backdrop-filter:blur(10px);
  transform:translateY(40px);
  opacity:0;
  transition:0.6s ease;
}

.card.show{
  transform:translateY(0);
  opacity:1;
}

footer{
  text-align:center;
  padding:30px;
  opacity:0.6;
}

/* ANIMATION */
@keyframes fadeUp{
  to{
    opacity:1;
    transform:translateY(0);
  }
}
</style>
</head>

<body>

<!-- NAV -->
<nav>
  <h1>KG MASS <span>(PTY)</span></h1>
  <a href="tel:0827644967">Call Now</a>
</nav>

<!-- HERO VIDEO -->
<section class="hero">
  <video autoplay muted loop>
    <source src="https://cdn.pixabay.com/video/2019/06/11/24408-345287921_large.mp4" type="video/mp4">
  </video>

  <div class="overlay"></div>

  <div class="hero-content">
    <h2>Luxury Plumbing Solutions</h2>
    <p>Fast. Reliable. Premium workmanship in Modimolle.</p>
    <a class="btn" href="#services">Explore</a>
  </div>
</section>

<!-- SERVICES -->
<section class="section" id="services">
  <h2>Services</h2>

  <div class="cards">
    <div class="card">Leak Repairs</div>
    <div class="card">Pipe Installation</div>
    <div class="card">Drain Cleaning</div>
    <div class="card">Bathroom Fitting</div>
    <div class="card">Emergency Call-outs</div>
    <div class="card">Maintenance</div>
  </div>
</section>

<footer>
  © KG MASS (PTY)
</footer>

<script>
const cards = document.querySelectorAll('.card');

const observer = new IntersectionObserver(entries => {
  entries.forEach(entry => {
    if(entry.isIntersecting){
      entry.target.classList.add('show');
    }
  });
});

cards.forEach(card => observer.observe(card));
</script>

</body>
</html>
